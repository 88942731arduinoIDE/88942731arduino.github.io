<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch フォロワー カウンター🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Scratch フォロワー カウンター</h1>
            <p>88942731arduinoIDE のフォロワーを1秒ごとにカウント！</p>
        </div>

        <div class="main-content">
            <div class="follower-card">
                <div class="label">現在のフォロワー数</div>
                <div class="follower-count" id="followerCount">読み込み中...</div>
                <div class="last-update" id="lastUpdate">更新中...</div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">増加数</div>
                    <div class="stat-value" id="increaseCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">確認日時</div>
                    <div class="stat-value" id="currentTime">--:--:--</div>
                </div>
            </div>
        </div>

        <div class="history">
            <h2>📊 増加履歴</h2>
            <div class="history-list" id="historyList">
                <p class="no-data">まだ増加がありません</p>
            </div>
        </div>
    </div>

    <!-- 派手な祝い要素 -->
    <div id="celebrationOverlay" class="celebration-overlay">
        <div class="celebration-text" id="celebrationText">
            フォロワー増えた！🎉
        </div>
    </div>

    <!-- 紙吹雪用キャンバス -->
    <canvas id="confettiCanvas"></canvas>

    <!-- キラキラエフェクト用 -->
    <div id="sparkles"></div>

    <script src="script.js"></script>
</body>
</html>
